name: Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version:
        - '8.5'

    steps:
    - uses: actions/checkout@v5

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: xdebug

    - name: Validate composer.json
      run: composer validate --strict

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-${{ matrix.php-version }}-php-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.php-version }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Check code style
      run: composer cs

    - name: Static analysis
      run: composer stan

    - name: Run test suite with coverage (100% lines required)
      run: composer coverage

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Read version
      id: versioning
      run: |
        VERSION=$(grep "public const string VERSION" src/RuleEngine.php | cut -d"'" -f2)
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Could not read a semantic version from src/RuleEngine.php" >&2
          exit 1
        fi
        echo "Version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Create ZIP artifact
      run: |
        ZIP_NAME="rule-engine-${{ steps.versioning.outputs.version }}.zip"
        zip -r "$ZIP_NAME" . -x "*.git*" "vendor/*" "tests/*" "build/*" "bin/*" ".idea/*" ".github/*" \
          "composer.lock" "phpunit.xml.dist" "phpstan.neon.dist" ".php-cs-fixer.dist.php" "*.cache" "*.cache/*" "CLAUDE.md"
        echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

    - name: Create tag and release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v${{ steps.versioning.outputs.version }}"
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists. Skipping release creation."
        else
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "$ZIP_NAME" --title "Release $TAG" --generate-notes
        fi
